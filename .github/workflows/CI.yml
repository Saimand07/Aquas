name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_CONTRACT_ADDRESS: "0x2459ebb32d836193b34e132505e339f54ae9f18fb215fe78e07935bdcb74007c"
  NEXT_PUBLIC_PREPROD_CONTRACT_ADDRESS: "0xce1d7691169612b03b908fa81f829d337aa3a99222f779df849017b4ea437c68"
  NEXT_PUBLIC_INDEXER_URI: "https://api-preprod.1am.xyz/api/v4/graphql"
  NEXT_PUBLIC_INDEXER_WS_URI: "wss://api-preprod.1am.xyz/api/v4/graphql/ws"
  NEXT_PUBLIC_NODE_URI: "wss://rpc.preprod.midnight.network"
  AQUAS_EHR_API_KEY: "aq_live_hospital_secret_key_ci_demo"
  AQUAS_WEBHOOK_SECRET: "whsec_midnight_aquas_regulatory_audit_stream"

jobs:
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: ESLint validation
        run: npm run lint
      - name: Next.js production build
        run: npm run build

  contract:
    name: Contract compile, asset sync and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Compact CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
      - name: Add Compact CLI to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Compact compiler 0.31.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: compact update 0.31.1
      - name: Compile Compact smart contract
        run: npm run contract:compile
      - name: Sync proving assets to public/zk
        run: npm run contract:sync-assets
      - name: Verify compiled and public ZK assets
        run: |
          test -f contracts/managed/doctor_license/contract/index.js
          test -f contracts/managed/doctor_license/contract/index.d.ts
          test -f public/zk/doctor_license/keys/proveValidLicense.prover
          test -f public/zk/doctor_license/keys/proveValidLicense.verifier
          test -f public/zk/doctor_license/zkir/proveValidLicense.zkir
          echo "All Midnight Compact contract artifacts and proving bundles verified."
      - name: Run Vitest test suite (24 suites, 179 tests)
        run: npm run test
